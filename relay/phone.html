<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="罗宾猫雷达">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>罗宾猫雷达</title>
<style>
:root{--bg:#0a0b0d;--card:#111317;--card2:#171a1f;--line:#20242b;--ink:#e9ebef;--mute:#838b98;--green:#2ebd85;--red:#f6465d;--gold:#f0b90b;--orange:#ff9f43;--blue:#4ea3ff;--sb:env(safe-area-inset-bottom);--st:env(safe-area-inset-top)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.num,.big,.px,.tr .rt{font-variant-numeric:tabular-nums}
.up{color:var(--green)}.dn{color:var(--red)}.mu{color:var(--mute)}
/* 顶栏 */
header.top{position:sticky;top:0;z-index:6;background:rgba(10,11,13,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(var(--st) + 10px) 18px 10px;display:flex;align-items:center;gap:10px}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.brand b{font-weight:800;font-size:17px;white-space:nowrap;display:block;letter-spacing:.2px}
.brand .cat{width:32px;height:32px;border-radius:10px;flex:none;object-fit:cover;background:#16191e;box-shadow:0 0 0 1px rgba(240,185,11,.25)}
.pc{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mute);flex:none}
.dot.on{background:var(--green);box-shadow:0 0 0 3px rgba(46,189,133,.2)}
.stopB{background:rgba(246,70,93,.12);color:#ff8f9e;border:1px solid rgba(246,70,93,.35);border-radius:999px;padding:7px 13px;font-weight:700;font-size:13px;white-space:nowrap}
.stopB.on{background:var(--red);color:#fff;border-color:var(--red)}
main{padding:0 0 calc(var(--sb) + 104px)}
.warnbar{margin:4px 16px 8px;background:rgba(246,70,93,.12);color:#ffb3bd;border:1px solid rgba(246,70,93,.3);border-radius:14px;padding:10px 13px;font-size:13px;display:none}
/* 首页大卡：猫＋总值＋盈亏曲线 */
.hero{margin:6px 14px 4px;border-radius:24px;padding:16px 16px 12px;background:radial-gradient(120% 90% at 100% 0%,rgba(240,185,11,.16),rgba(240,185,11,0) 55%),linear-gradient(160deg,#17191e,#101215 70%);border:1px solid #262a31;box-shadow:0 12px 34px rgba(0,0,0,.35);position:relative;overflow:hidden}
.hero .hh{display:flex;align-items:center;gap:9px;font-size:13px;color:#b9c0cb;font-weight:600}
.hero .hh img,.hero .hh .catf{width:26px;height:26px;border-radius:8px;flex:none}
.hero .hh span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .hh em{font-style:normal;font-size:11.5px;color:var(--gold);background:rgba(240,185,11,.12);padding:2px 8px;border-radius:999px}
.big{font-size:36px;font-weight:800;letter-spacing:-.5px;line-height:1.15;margin-top:8px}
.big span{color:#5d6470}
.pl{font-size:14.5px;font-weight:600;margin-top:2px}.pl i{font-style:normal;color:var(--mute);font-weight:500;margin-left:4px}
.rseg{display:flex;gap:4px;margin:12px 0 4px;background:rgba(0,0,0,.25);padding:3px;border-radius:12px}
.rseg button{flex:1;padding:6px 0;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--mute)}
.rseg button.on{background:#2a2e36;color:var(--ink)}
canvas.pnl{width:100%;height:100px;display:block;touch-action:pan-y;margin-top:6px}
.pnlv{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute);min-height:18px;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pnlv b{font-weight:700}
.sech{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;padding:18px 18px 10px}
.sech small{font-size:12.5px;color:var(--mute);font-weight:500}
.cnt{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 7px;border-radius:999px;background:var(--card2);border:1px solid #2a2f37;color:#b9c0cb;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.cnt.y{background:rgba(240,185,11,.14);border-color:rgba(240,185,11,.25);color:var(--gold)}
.cards{display:flex;gap:10px;overflow-x:auto;padding:0 18px 4px;scrollbar-width:none;scroll-snap-type:x mandatory}.cards::-webkit-scrollbar{display:none}
.hc{flex:none;width:160px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;scroll-snap-align:start;text-align:left;transition:transform .12s}
.hc .a{display:flex;align-items:center;gap:8px;padding:11px 12px;font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden}
.hc .a span{overflow:hidden;text-overflow:ellipsis}
.hc .b{background:var(--card2);padding:11px 12px;font-weight:700;font-size:17px;white-space:nowrap}
.hc .b small{display:block;font-size:12px;font-weight:500;color:var(--mute)}
/* 焦点：涨最多／共振／聪明钱 */
.mvs{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 4px;scrollbar-width:none}.mvs::-webkit-scrollbar{display:none}
.mv{flex:none;display:flex;align-items:center;gap:7px;padding:6px 11px 6px 6px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700;white-space:nowrap;transition:transform .12s}
.mv i{font-style:normal;font-size:11px;font-weight:700;padding:1px 6px;border-radius:999px}
.mv i.k1{background:rgba(46,189,133,.14);color:#6fe0b0}.mv i.k2{background:rgba(240,185,11,.15);color:var(--gold)}.mv i.k3{background:rgba(78,163,255,.15);color:#8cc4ff}
.mv .v{font-weight:600;font-size:12.5px}
/* 分页、筛选 */
.ntabs{display:flex;border-bottom:1px solid var(--line);margin-top:14px;position:sticky;top:calc(var(--st) + 58px);z-index:4;background:var(--bg)}
.ntabs button{flex:1;padding:12px 0 11px;font-size:16px;font-weight:700;color:var(--mute);position:relative}
.ntabs button.on{color:var(--ink)}
.ntabs button.on::after{content:"";position:absolute;left:22%;right:22%;bottom:-1px;height:3px;border-radius:3px;background:var(--gold)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 18px 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:7px 13px;border-radius:12px;border:1px solid var(--line);color:var(--mute);font-size:14px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px;transition:transform .12s}
.chips button.on{background:var(--card2);color:var(--ink);border-color:#3a3420;box-shadow:inset 0 0 0 1px rgba(240,185,11,.2)}
.chips button small{color:var(--mute);font-weight:600;font-size:12px;background:rgba(255,255,255,.05);padding:0 6px;border-radius:999px}
.chips button.on small{color:var(--gold);background:rgba(240,185,11,.12)}
/* 代币行 */
.tr{display:flex;align-items:center;gap:11px;padding:10px 18px;min-height:70px;width:100%;text-align:left;transition:background-color .12s}
.tr:active,.tr.pr{background:var(--card)}
.lg{flex:none;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff;overflow:hidden;border:1px solid rgba(255,255,255,.06);position:relative}
.lg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lg.s{width:26px;height:26px;font-size:12px}
.lg.m{width:42px;height:42px;font-size:17px}
.lg.xs{width:22px;height:22px;font-size:10.5px}
.tr .nm{flex:1;min-width:0}
.tr .t{display:flex;align-items:center;gap:5px;min-width:0;white-space:nowrap;overflow:hidden}
.tr .t b{font-size:16.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
.tr .nm small{display:block;color:var(--mute);font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tr .nm small.l2{margin-top:1px;font-size:12.5px} /* UIFIX6 第 2 行 */
.tr .rt{text-align:right;flex:none;max-width:42%}
.tr .rt b{display:block;font-size:16px;font-weight:700;white-space:nowrap}
.tr .rt small{display:block;font-size:13px;font-weight:600;margin-top:3px;white-space:nowrap}
.sp{flex:none;width:52px;height:24px;display:block}
.pp{display:inline-block;min-width:62px;text-align:center;padding:2px 7px;border-radius:7px;font-size:12.5px;font-weight:700}
.pp.up{background:rgba(46,189,133,.14)}.pp.dn{background:rgba(246,70,93,.14)}.pp.mu{background:rgba(255,255,255,.05)}
.tag{flex:none;display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--card2);color:var(--mute);line-height:16px}
.tag.y{background:rgba(240,185,11,.14);color:var(--gold)}.tag.r{background:rgba(246,70,93,.14);color:#ff8f9e}.tag.g{background:rgba(46,189,133,.14);color:#6fe0b0}.tag.o{background:rgba(255,159,67,.15);color:#ffb877}.tag.b{background:rgba(78,163,255,.15);color:#8cc4ff}
.tag.pg{position:relative;overflow:hidden;background:rgba(240,185,11,.08)}
.tag.pg i{position:absolute;left:0;top:0;bottom:0;background:rgba(240,185,11,.22)}
.tag.pg span{position:relative}
.empty{color:var(--mute);text-align:center;padding:44px 10px;font-size:14px}
.ptitle{font-size:28px;font-weight:800;padding:8px 18px 2px;display:flex;align-items:center;gap:10px}
.psub{font-size:13px;color:var(--mute);padding:0 18px 6px}
.hr{border-bottom:1px solid var(--line)}.hr:last-child{border-bottom:0}
.sells{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 18px 14px 75px}
.sells button{padding:8px 0;border-radius:11px;background:rgba(246,70,93,.12);color:#ff8f9e;font-weight:700;font-size:13.5px;transition:transform .12s}
/* 骨架（读取中） */
.skb{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,#15181d 0%,#1d2128 40%,#15181d 80%);background-size:300% 100%;animation:sk 1.3s linear infinite}
.lg.skb{height:46px;border:0}
.sk .nm .skb+.skb{margin-top:8px}.sk .rt .skb{margin-left:auto}.sk .rt .skb+.skb{margin-top:8px}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-50% 0}}
/* 卡片 */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px 16px;margin:0 16px 12px}
.card h4{margin:0 0 8px;font-size:16px}
.note{font-size:13px;color:var(--mute);margin:8px 0;line-height:1.65}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 14px;border-radius:14px;font-weight:700;background:var(--card2);font-size:15px;transition:transform .12s,filter .12s}
.btn.y{background:var(--gold);color:#16130a}.btn.r{background:rgba(246,70,93,.14);color:#ff8f9e}.btn.rr{background:var(--red);color:#fff}.btn.g{background:var(--green);color:#03150d}
.btn:disabled{opacity:.45}
.btn:active,.mv:active,.hc:active,.chips button:active,.sells button:active,.dbar button:active,.sg:active,.seg button:active{transform:scale(.97);filter:brightness(1.12)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all;color:var(--mute)}
.qrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid #1b1e24;font-size:14px}.qrow:first-of-type{border-top:0}
.qrow b{font-variant-numeric:tabular-nums}
/* 信号 */
.sg{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin:0 14px 10px;width:calc(100% - 28px);transition:transform .12s}
.sg.hot{border-color:rgba(240,185,11,.35);background:linear-gradient(160deg,rgba(240,185,11,.07),var(--card) 55%)}
.sg .h{display:flex;align-items:center;gap:10px}
.sg .h .nm{flex:1;min-width:0}
.sg .h .nm b{font-size:16.5px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.sg .h .nm small{display:block;color:var(--mute);font-size:12.5px}
.sg .h .r{text-align:right;font-weight:700;white-space:nowrap}.sg .h .r small{display:block;color:var(--mute);font-size:12px;font-weight:500}
.rb{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:linear-gradient(90deg,#f0b90b,#ff9f43);color:#1a1205}
.srcs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.srcs span{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:#1b1f25;color:#b9c0cb;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xb{margin-top:11px}
.xb .l{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-bottom:5px;font-variant-numeric:tabular-nums}
.xb .l b{color:var(--ink)}
.xb .tk{position:relative;height:8px;border-radius:5px;background:#1b1f25;overflow:hidden}
.xb .tk i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.xb .tk em{position:absolute;top:-1px;bottom:-1px;width:3px;border-radius:2px;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.35)}
/* 底部浮动导航 */
nav.tab{position:fixed;left:14px;right:14px;bottom:calc(var(--sb) + 10px);z-index:8;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px;background:rgba(23,26,31,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid #2a2f37;border-radius:30px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
nav.tab button{height:54px;border-radius:24px;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:600;position:relative}
nav.tab svg{width:23px;height:23px}
nav.tab button.on{background:#262a32;color:var(--ink)}
nav.tab button.on svg{color:var(--gold)}
nav.tab button sup{position:absolute;top:6px;left:calc(50% + 8px);min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--gold);color:#16130a;font-size:10px;font-weight:800;line-height:16px;text-align:center}
/* 底部弹出 */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet>div{width:100%;max-height:88vh;overflow:auto;background:#121418;border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:10px 18px calc(var(--sb) + 18px)}
.sheet>div::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:#30353e;margin:0 auto 12px}
.sheet h3{margin:0 0 4px;font-size:19px;display:flex;align-items:center;gap:8px}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 8px}
.qgrid .btn{padding:16px 4px;font-size:16px;flex-direction:column}
.qgrid .btn small{font-size:11.5px;font-weight:600;opacity:.75}
.qempty{grid-column:1/-1;text-align:center;padding:18px 10px;border-radius:14px;border:1px dashed #3a3f48;color:#c9ced6;font-weight:700;font-size:15px}
.qempty small{display:block;color:var(--mute);font-weight:500;font-size:12.5px;margin-top:4px}
/* U／BNB 切换 */
.seg{display:flex;gap:4px;background:#0c0d10;border:1px solid #23272e;padding:3px;border-radius:12px}
.seg button{flex:1;padding:8px 0;border-radius:9px;font-size:14px;font-weight:800;color:var(--mute);white-space:nowrap}
.seg button.on{background:var(--gold);color:#16130a}
.seg button small{font-weight:600;font-size:11px;opacity:.8;margin-left:3px}
.uq{display:flex;align-items:center;gap:10px;margin:10px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px 8px 12px;font-size:12.5px;color:var(--mute)}
.uq:empty{display:none}
.uq .seg{flex:none;width:136px}
.uq span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uq span b{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 100px);transform:translateX(-50%);background:#262a32;color:var(--ink);padding:11px 16px;border-radius:14px;font-size:14px;z-index:40;max-width:88vw;display:none;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.pair{max-width:420px;margin:0 auto;text-align:center;padding:calc(var(--st) + 12vh) 22px 0}
.pair h1{font-size:24px;margin:18px 0 8px}
.pair p{color:var(--mute);line-height:1.75}
/* 代币详情 */
.dt{position:fixed;inset:0;z-index:15;background:var(--bg);overflow-y:auto;overflow-x:hidden;display:none;-webkit-overflow-scrolling:touch}
.dt.on{display:block}
.dth{position:sticky;top:0;z-index:3;background:rgba(10,11,13,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(var(--st) + 8px) 14px 10px 6px;display:flex;align-items:center;gap:10px}
.dth .bk{width:36px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.dth .nm{flex:1;min-width:0}
.dth .nm b{font-size:19px;font-weight:800;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.dth .nm small{display:block;color:var(--mute);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#b9c0cb}
.ib:active{background:var(--card2)}
.ib svg{width:22px;height:22px}
.pxrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:6px 18px 0;min-height:76px}
.px{font-size:34px;font-weight:800;letter-spacing:-.4px;line-height:1.15;white-space:nowrap}
.chg{font-size:15px;font-weight:600;margin-top:2px;white-space:nowrap}.chg i{font-style:normal;color:var(--mute);font-weight:500;margin-left:3px}
.mcR{text-align:right;padding-top:6px}.mcR b{display:block;font-size:20px;font-weight:700;white-space:nowrap}.mcR small{color:var(--mute);font-size:13px}
canvas.kc{width:100%;height:300px;display:block;touch-action:pan-y;margin-top:8px}
.tfs{display:flex;gap:4px;overflow-x:auto;padding:8px 14px 0;scrollbar-width:none}.tfs::-webkit-scrollbar{display:none}
.tfs button{flex:none;min-width:46px;padding:7px 10px;border-radius:10px;font-size:14px;font-weight:700;color:var(--mute)}
.tfs button.on{background:var(--card2);color:var(--ink);box-shadow:inset 0 0 0 1px #2c313a}
.kn{font-size:12px;color:var(--mute);padding:4px 18px 0;height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chg4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 16px 0}
.chg4 div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 4px;text-align:center;font-size:11.5px;color:var(--mute)}
.chg4 b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.myh{margin:12px 16px 0;background:linear-gradient(160deg,rgba(46,189,133,.06),var(--card) 60%);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.myh .l{flex:1;min-width:0;font-size:12.5px;color:var(--mute)}.myh .l b{display:block;color:var(--ink);font-size:18px}
.myh .r{text-align:right;font-weight:700;font-size:16px}.myh .r small{display:block;font-size:12px;color:var(--mute);font-weight:500}
.dtabs{display:flex;border-bottom:1px solid var(--line);margin:16px 16px 0}
.dtabs button{flex:1;padding:11px 0;font-size:16px;font-weight:700;color:var(--mute);position:relative}
.dtabs button.on{color:var(--ink)}
.dtabs button.on::after{content:"";position:absolute;left:12%;right:12%;bottom:-1px;height:3px;border-radius:3px;background:var(--gold)}
.dpane{padding:8px 16px 0;min-height:220px}

<script>
'use strict';
/* ── 加密：金钥只在 QR 码（网址 # 后面，不会送到伺服器）和这台手机上 ── */
const b64u = (b) => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

const PEND = new Map(), SEEN = new Map();
/* RT-11：① 方向放进 AES-GCM 的 AAD（'rc2:p2c:'+房间＝手机→电脑、'rc2:c2p:'+房间＝电脑→手机），转接站把手机的消息弹回手机也解不开
   ② 连转接站要带 ts＋h＝HMAC(GATE, 'rcph1:'+房间+':'+ts)；GATE＝HMAC(配对金钥, 'rcph-gate-v1:'+房间)（电脑连线时用 g= 交给转接站），只知道房间号连不上
   ③ 每支手机有自己的编号 PID（localStorage）和递增序号 q（localStorage，只增不减），电脑记每个 PID 最后的 q，旧的一律不收（电脑重开也有效，要电脑端存起来）

  const gate = await crypto.subtle.sign('HMAC', mk, new TextEncoder().encode('rcph-gate-v1:' + ROOM));

}

function seenLoad() { try { const a = JSON.parse(sessionStorage.getItem(SEEN_K) || '[]'); if (Array.isArray(a)) for (const [k, t] of a) SEEN.set(k, t); } catch {} }

/* ── 小工具 ── */
const $ = (s) => document.querySelector(s);

/* ── 币的真图示：手机的安全设定只准 data: 图，所以请电脑代抓、缩成 48×48 小图再传来；记在这支手机（最多 300 个） ── */
const LOGO = new Map(Object.entries(lsGet('rcLogo', {}) || {}).filter(([u, v]) => /^https:\/\//.test(u) && /^data:image\/(webp|png|jpeg);base64,/.test(v)));

  const u = /^https:\/\//.test(img || '') ? img : CADDR.get(String(c || '').toLowerCase()) || '';

  const d = u && LOGO.get(u);

/* 只请画面上看得到的（卷到才要），一次最多 30 个 */

/* 迷你走势（电脑有本地成交资料才会给） */

<script id="smpPhJs">/* 简单／专业模式（手机，1.0.13）——只改手机画面，不改下单、不加任何数字。模式存在这支手机（rcMode），不送到电脑。
   简单：持仓每列一颗「卖」（＝原本的「全卖」，同一个确认框）、详情「全部卖出」（原本的 doSell 确认框）、「自订策略」页换成两个止盈止损勾选；挖矿提醒、铸造方式卡收起来。
   专业：跟原本一模一样。顶部写「电脑上专业里还开着：…」（电脑带来的清单，照跑）。
   电脑太旧没带清单（ST.smp）→ 不知道开了什么，就用专业（不藏东西）。止盈止损存档走原本的「确认修改 → 保存 → 可撤销」流程（要电脑打开「手机可以改设定」）。 */
(function(){
const MK='rcMode';let M=(()=>{try{const v=localStorage.getItem(MK);return v==='simple'||v==='adv'?v:''}catch{return ''}})();
const mode=()=>{if(M)return M;const S=ST?.smp;if(!S||!Array.isArray(S.adv))return 'adv';M=S.adv.length||!S.tp?.simple?'adv':'simple';try{localStorage.setItem(MK,M)}catch{}return M};
const simple=()=>mode()==='simple';window.rcSimple=simple;/*MINE117*/
function setMode(m){if(m!=='simple'&&m!=='adv')return;M=m;try{localStorage.setItem(MK,m)}catch{}const pg=$('#pg');if(pg)pg.dataset.t='';render()}
const modeCard=()=>{const s=simple();return `<div class="card smpMode"><h4>🧭 画面模式</h4><div class="g2"><button class="btn ${s?'y':''}" data-smpm="simple">简单</button><button class="btn ${s?'':'y'}" data-smpm="adv">专业</button></div><p class="note">${s?'简单：看盘 ⚡、买、全部卖出、两个止盈止损勾选。':'专业：显示全部策略、条件、开关、铸造、挖矿。'}模式只影响这支手机的画面，不会关掉电脑上任何功能。</p></div>`};
const advList=()=>(Array.isArray(ST?.smp?.adv)?ST.smp.adv:[]);
const advCard=()=>{const A=advList();return A.length?`<div class="card smpAdvC"><h4>专业里还开着</h4><p class="note">${A.map(esc).join('、')}</p><p class="note">这些在电脑上照常在跑，简单模式只是把画面收起来。<button class="btn" data-smpm="adv" style="margin-top:6px;width:100%">切到专业查看</button></p></div>`:''};
function tpCard(){const T=ST?.smp?.tp;if(!T)return `<div class="card"><h4>自动卖（你自己买的币）</h4><p class="note">读不到电脑的止盈止损设定（电脑雷达要更新到新版）。</p></div>`;
 if(!T.simple)return `<div class="card"><h4>自动卖（你自己买的币）</h4><p class="note">你在专业设了：<b style="color:#f0b90b">${esc(T.txt||'')}</b>${T.on?'':'（目前关着）'}</p><p class="note">简单模式只显示、不会改掉。要改回两个简单勾选，请在电脑雷达按「改回简单设定」，或切到专业在「自订策略」改。</p></div>`;
 const v=(x)=>x==null?'':esc(String(x));
 return `<div class="card smpTp"><h4>自动卖（你自己买的币）<small class="mu" style="font-weight:400"> · ${T.on&&(T.tpOn||T.slOn)?'开着':'只通知不卖'}</small></h4>
 <label class="smpRow"><input type="checkbox" data-smpc="tp" ${T.tpOn?'checked':''}>涨到<input type="number" inputmode="decimal" min="0" step="any" data-smpv="x" value="${v(T.x)}" placeholder="倍">倍，卖<input type="number" inputmode="decimal" min="0" step="any" data-smpv="y" value="${v(T.y)}" placeholder="%">%</label>
 <label class="smpRow"><input type="checkbox" data-smpc="sl" ${T.slOn?'checked':''}>跌<input type="number" inputmode="decimal" min="0" step="any" data-smpv="z" value="${v(T.z)}" placeholder="%">% 全卖</label>
 <p class="note">两个都不勾＝只通知、不卖；数字留空＝那一条不启用。数字全部你自己填——例如有人会涨到自己定的倍数先卖一半回本。</p>
 <p class="note">卖掉一部分后，剩下的只有在「跌 … % 全卖」开着时才会被止损；没开就一直拿着。只套用到之后买的币。</p>
 <button class="btn y" data-smpsave="1" style="width:100%">保存（会先列出修改让你确认）</button></div>`}
function readTp(){const g=(k)=>{const s=String(document.querySelector(`.smpTp [data-smpv="${k}"]`)?.value??'').trim();return s===''?null:Number(s)};const c=(k)=>!!document.querySelector(`.smpTp [data-smpc="${k}"]`)?.checked;
 const x=g('x'),y=g('y'),z=g('z');let tp='',sl='';const err=[];
 if(c('tp')&&x!=null&&y!=null){if(!(x>1))err.push('倍数要大于 1');else if(!(y>0&&y<=100))err.push('卖出比例要大于 0、最多 100');else tp=String(+((x-1)*100).toPrecision(12))+':'+String(y)} /* 卖出比例最多＝全部（资料格式边界） */
 if(c('sl')&&z!=null){if(!(z>0))err.push('跌幅要大于 0');else sl=z}
 return {err,ch:{'tpsl.on':tp||sl!==''?1:0,'tpsl.tp':tp,'tpsl.sl':sl}}}
async function saveTp(){const r=readTp();if(r.err.length)return toast('⚠️ '+r.err.join('；'),3500);
 let d;try{d=await req('pset',{},30000)}catch(e){return toast('❌ '+e.message,4000)}if(!d||!d.rw)return toast(d?.why||'手机现在只能看设定（电脑上要打开「手机可以改设定」）',4000);
 const base={};for(const k of Object.keys(r.ch))base[k]=d.vals?.[k]??null;
 let x;try{x=await req('psetSave',{ch:r.ch,base,floorOk:[],dry:1},30000)}catch(e){return toast('❌ '+e.message,4000)}
 if(x?.err)return toast('❌ '+(Array.isArray(x.err)?x.err.join('；'):x.err),4000);if(!x?.diff?.length)return toast(x?.msg||'没有改到任何东西');if(!(await diffBox(x)))return toast('没有保存');
 let s;try{s=await req('psetSave',{ch:r.ch,base,floorOk:[],dry:0},30000)}catch(e){return toast('❌ '+e.message,4000)}if(s?.err)return toast('❌ '+(Array.isArray(s.err)?s.err.join('；'):s.err),4000);toast(s?.msg||'已保存，电脑雷达已更新',3000)}
/* 画面 */
const ps0=pgSet;pgSet=function(){if(!simple())return modeCard()+ps0.apply(this,arguments);return `<div class="ptitle">🎯 自订策略</div><div class="psub">简单模式：只有止盈止损两个勾选；完整的策略、条件在「专业」</div><div style="height:8px"></div>`+tpCard()+advCard()+modeCard()};
const frCard=()=>`<div class="card" style="border-color:#f6465d88"><h4 style="color:#f6465d">⚠️ 恢复出厂设置</h4><p class="note">所有策略、开关、条件、止盈止损、卖出规则、铸造、挖矿、外挂开关回到预设（全关）。<b style="color:#f0b90b">持仓已经存的卖出规则也会清掉，之后只通知、不会自动卖。</b>钱包、邀请绑定、持仓、交易记录、画面设定都不动；紧急全停中就保持全停。会先备份；要复原请在电脑雷达设定页按「复原上一次设定」。要电脑开了「手机可以改设定」才能按。</p><button class="btn" data-frs="1" style="width:100%;background:#f6465d;color:#fff;border-color:#f6465d">恢复出厂设置</button></div>`;/*RESET117*/
document.addEventListener('click',async(e)=>{const b=e.target.closest&&e.target.closest('[data-frs]');if(!b)return;e.stopPropagation();if(!(await confirmBox('⚠️ 确定恢复出厂设置？','所有策略、开关、条件、止盈止损、卖出规则都回到预设（全关）。\n持仓已经存的卖出规则也会清掉：之后只通知、不会自动卖。\n会先备份，可以在电脑上复原。','继续','rr')))return;
 const v=await new Promise((res)=>{openSheet('<h3>最后一步：请输入「重置」两个字</h3><input id="frT" autocomplete="off" style="width:100%;padding:12px;border-radius:10px;border:1px solid #f6465d;background:#0a0c10;color:#fff;font-size:16px;margin:10px 0"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn" id="frNo">取消</button><button class="btn rr" id="frOk">确定恢复出厂设置</button></div>');$('#frNo').onclick=()=>{closeSheet();res(null)};$('#frOk').onclick=()=>{const x=$('#frT').value;closeSheet();res(x)}});
 if(v==null)return;if(String(v).trim()!=='重置')return toast('没有执行：要输入「重置」两个字',3500);try{const r=await req('freset',{txt:String(v).trim()});toast(r?.msg||'已恢复出厂设置',6000)}catch(x){toast('❌ '+x.message,5000)}},true);
const pm0=pgMore;pgMore=function(){let h=pm0.apply(this,arguments);if(simple()){const d=document.createElement('div');d.innerHTML=h;for(const c of [...d.children])if(/挖矿提醒|铸造方式/.test(c.querySelector?.('h4')?.textContent||''))c.remove();h=d.innerHTML}return modeCard()+h+(simple()?'':frCard())/*RESET117 专业模式才显示*/};
const fh0=fillHold;fillHold=function(){const r=fh0.apply(this,arguments);try{if(simple())document.querySelectorAll('#hList .sells').forEach(s=>{for(const b of [...s.querySelectorAll('[data-a="hsell"]')]){if(+b.dataset.p>=100){if(b.textContent!=='卖')b.textContent='卖'}else b.remove()}})}catch{}return r};
const pb0=paintBar;paintBar=function(){const r=pb0.apply(this,arguments);try{const b=document.querySelector('#dbar [data-a="sellsheet"]');if(b&&simple()){b.dataset.a='smpsell';b.textContent='全部卖出'}}catch{}return r};
const r0=render;render=function(){const r=r0.apply(this,arguments);try{paint()}catch{}return r};
function paint(){const s=simple();if(document.body.classList.contains('smpOn')!==s)document.body.classList.toggle('smpOn',s);let b=$('#smpPhAdv');const bn=$('#bnr');if(!b&&bn){b=document.createElement('div');b.id='smpPhAdv';bn.after(b)}if(!b)return;const A=s?advList():[];const h=A.length?`<b>专业里还开着：</b>${A.map(esc).join('、')}<small>照常在跑，简单模式只是收起来</small>`:'';if(b._h!==h){b.innerHTML=h;b._h=h}b.style.display=A.length&&TAB!=='set'?'':'none'}
document.addEventListener('click',(e)=>{const m=e.target.closest?.('[data-smpm]');if(m){e.preventDefault();e.stopPropagation();setMode(m.dataset.smpm);return}
 const sv=e.target.closest?.('[data-smpsave]');if(sv){e.preventDefault();e.stopPropagation();saveTp();return}
 const ss=e.target.closest?.('[data-a="smpsell"]');if(ss){e.preventDefault();e.stopPropagation();if(DT)doSell(DT.c,DT.d?.sym||DT.sym,100,DT.net);return}},true); /* 100＝全部卖出（这颗按钮的意思），走原本的 doSell 确认框 */
})();
</script><!--/smpPhJs-->
<style id="fbPh">/*FB-PHONE CSS*/
#fbPhOv{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:4px 18px 2px;font-size:12px;color:var(--mute)}#fbPhOv .fbPhT{color:var(--ink);font-weight:600}

<script id="fbPhJs">/*FB-PHONE：手机版跟电脑同步 —— K 线标出有标签的交易者（KOL 金、聪明钱蓝、巨鲸紫、DEV 红、我的交易绿），K 线下方「图表叠加层」开关（记在这支手机）；看盘列表照 FOMO 手机版密度。资料读不到就不画。*/
(function(){
const OVK='fbPhOv';let OV={me:1,kol:1,smart:1,whale:1,dev:0,min:''};try{Object.assign(OV,JSON.parse(localStorage.getItem(OVK)||'{}'))}catch{}
const sv=()=>{try{localStorage.setItem(OVK,JSON.stringify(OV))}catch{}};
const COL={me:'#2ebd85',kol:'#f0b90b',smart:'#3b82f6',whale:'#a855f7',dev:'#f6465d'};const LB={me:'我的交易',kol:'KOL',smart:'聪明钱',whale:'巨鲸',dev:'DEV'};
const mine=()=>new Set((Array.isArray(ST?.wallets)?ST.wallets:[]).map(w=>String(w?.addr||'').toLowerCase()).filter(Boolean));
function ovBar(){const kn=document.getElementById('kn');if(!kn)return;let b=document.getElementById('fbPhOv');if(!b){b=document.createElement('div');b.id='fbPhOv';kn.after(b);b.addEventListener('change',e=>{const i=e.target;if(!i.dataset.k)return;OV[i.dataset.k]=i.dataset.k==='min'?i.value.trim():(i.checked?1:0);sv();drawK()})}
 const h='<span class="fbPhT">图表叠加层</span>'+Object.keys(LB).map(k=>`<label><input type="checkbox" data-k="${k}" ${OV[k]?'checked':''}><i style="--c:${COL[k]}"></i>${LB[k]}</label>`).join('')+`<label class="mn">最小金额 $<input type="number" inputmode="decimal" min="0" data-k="min" value="${String(OV.min||'').replace(/[^\d.]/g,'')}" placeholder="不限"></label>`;
 if(b.__h!==h&&!b.contains(document.activeElement)){b.innerHTML=h;b.__h=h}}
const d0=drawK;
drawK=function(){const r=d0.apply(this,arguments);try{ovBar();marks()}catch(e){}return r};
const t0=paintTape;paintTape=function(){const r=t0.apply(this,arguments);try{if(DT&&(DT.cs||[]).length)drawK()}catch{}return r}; /* 成交到了 → K 线补上标记 */
function marks(){const cv=document.getElementById('kc');if(!cv||!DT)return;const cs=DT.cs||[];if(!cs.length)return;let R0=[];try{R0=typeof pawTape==='function'?pawTape(DT):(DT.tape?.rows||[])}catch{R0=DT.tape?.rows||[]}if(!R0.length)return;
 const W=cv.clientWidth,H=cv.clientHeight;if(!W||!H)return;const R=64;const n=Math.min(cs.length,Math.max(30,Math.floor((W-R)/7)));const K=cs.slice(-n);const vh=40,top=14,ph=H-vh-top-26;
 let hi=-Infinity,lo=Infinity;for(const k of K){hi=Math.max(hi,k[2]);lo=Math.min(lo,k[3])}{const r0=hi-lo||hi*0.02||1;hi+=r0*0.08;lo=Math.max(0,lo-r0*0.08)}const rg=hi-lo||hi*0.02||1;
 const y=v=>top+ph*(1-(v-lo)/rg);const bw=(W-R-6)/Math.max(K.length,30),ox=(W-R-6)-K.length*bw;const T=t=>typeof tms==='function'?tms(t):t;
 const iv=K.length>1?T(K[1][0])-T(K[0][0]):300e3;const me=mine();const mn=+OV.min>0?+OV.min:0;const G=new Map();
 for(const x of R0){const tg=new Set(x.tg||[]);if(x.w&&me.has(String(x.w).toLowerCase()))tg.add('me');const k=['me','kol','smart','whale','dev'].find(z=>OV[z]&&tg.has(z));if(!k)continue;if(mn&&!(+x.usd>=mn))continue;
  const t=+x.t;let i=-1;for(let j=K.length-1;j>=0;j--)if(T(K[j][0])<=t){i=j;break}if(i<0||t>T(K[K.length-1][0])+iv)continue;const key=i+':'+(x.b?1:0);const g=G.get(key);if(g)g.n++;else G.set(key,{i,b:x.b,k,n:1})}
 const g=cv.getContext('2d');const dpr=window.devicePixelRatio||1;g.setTransform(dpr,0,0,dpr,0,0);
 for(const v of G.values()){const k=K[v.i];const x=4+ox+v.i*bw+bw/2;const yy=v.b?Math.min(top+ph-6,y(k[3])+12):Math.max(8,y(k[2])-12);g.beginPath();g.arc(x,yy,7,0,Math.PI*2);g.fillStyle='#0a0c10';g.fill();g.lineWidth=2;g.strokeStyle=COL[v.k];g.stroke();
  g.fillStyle=COL[v.k];g.font='700 8px -apple-system,sans-serif';g.textAlign='center';g.fillText(v.k==='me'?'我':v.k==='kol'?'K':v.k==='smart'?'聪':v.k==='whale'?'鲸':'D',x,yy+3);g.beginPath();g.arc(x+5,yy+(v.b?6:-6),2.5,0,Math.PI*2);g.fillStyle=v.b?'#2ebd85':'#f6465d';g.fill();
  if(v.n>1){g.fillStyle=COL[v.k];g.font='700 9px -apple-system,sans-serif';g.textAlign='left';g.fillText(String(v.n),x+8,yy-5)}}}
})();
</script><!--/fbPhJs-->
